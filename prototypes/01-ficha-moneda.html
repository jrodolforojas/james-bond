<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototipo 1 — Ficha a moneda</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --felt: #0F5B3A;
  --old-gold: #5C430A;
  --gold: #D4A017;
  --chip: #B0172A;
  --bone: #F4EEE1;
  --ink: #0B0B0C;
  --disc: 180px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: #000;
  font-family: 'Courier Prime', monospace;
  color: var(--bone);
  display: grid;
  place-items: center;
}
.stage {
  position: relative;
  width: min(100vw, 430px);
  height: min(100dvh, 932px);
  background: var(--felt);
  overflow: hidden;
  perspective: 900px;
}
.flash {
  position: absolute;
  inset: 0;
  background: var(--bone);
  opacity: 0;
  pointer-events: none;
}
.disc {
  position: absolute;
  left: 50%;
  top: 50%;
  width: var(--disc);
  height: var(--disc);
  margin: calc(var(--disc) / -2) 0 0 calc(var(--disc) / -2);
  transform-style: preserve-3d;
}
.disc__layer {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: var(--edge, #8A0F1F);
}
.disc__face {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  backface-visibility: hidden;
  display: grid;
  place-items: center;
}
.disc__face--back { transform: rotateY(180deg) translateZ(7px); }
.disc__face--front { transform: translateZ(7px); }

.disc:not(.is-coin) .disc__face {
  background:
    radial-gradient(circle, var(--chip) 0 52%, transparent 53%),
    repeating-conic-gradient(var(--bone) 0 12deg, var(--chip) 12deg 45deg);
}
.disc:not(.is-coin) .disc__face::after {
  content: '';
  width: 64%;
  height: 64%;
  border-radius: 50%;
  border: 3px dashed var(--bone);
}
.disc.is-coin { --edge: #8A6A12; }
.disc.is-coin .disc__face {
  background: radial-gradient(circle at 38% 32%, #F6D46A, var(--gold) 45%, #8A6A12 100%);
  box-shadow: inset 0 0 0 6px #B48812, inset 0 0 0 9px #E8B52A;
}
.disc.is-coin .disc__face::after {
  content: 'AU';
  font-family: 'Bodoni Moda', serif;
  font-size: 56px;
  color: #8A6A12;
  text-shadow: 1px 1px 0 #F6D46A;
}
.title {
  position: absolute;
  left: 0;
  right: 0;
  top: 44%;
  text-align: center;
  color: var(--ink);
  opacity: 0;
}
.title small { display: block; font-size: 12px; letter-spacing: .3em; margin-bottom: 8px; }
.title strong { font-family: 'Bodoni Moda', serif; font-weight: 500; font-size: 56px; }
.title em { display: block; font-family: 'Bodoni Moda', serif; font-size: 24px; }
.controls {
  position: absolute;
  left: 16px;
  right: 16px;
  bottom: 16px;
  display: flex;
  gap: 8px;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
}
button {
  min-height: 44px;
  padding: 0 16px;
  background: var(--ink);
  color: var(--bone);
  border: 1px solid var(--bone);
  font-family: inherit;
  letter-spacing: .2em;
  cursor: pointer;
}
</style>
</head>
<body>
<main class="stage" id="stage" aria-label="Transición: la ficha de póker se convierte en moneda de oro">
  <div class="disc" id="disc" aria-hidden="true"></div>
  <div class="flash" id="flash"></div>
  <p class="title" id="title"><small>PARADA 3</small><strong>Fort Knox</strong><em>Detén el reloj</em></p>
  <div class="controls">
    <span id="mode"></span>
    <button type="button" id="replay">REPETIR</button>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
const EDGE_LAYERS = 12;
const COLORS = { felt: '#0F5B3A', oldGold: '#5C430A', gold: '#D4A017' };

const stage = document.getElementById('stage');
const disc = document.getElementById('disc');
const flash = document.getElementById('flash');
const title = document.getElementById('title');

function buildDisc() {
  for (let i = 0; i < EDGE_LAYERS; i++) {
    const layer = document.createElement('div');
    layer.className = 'disc__layer';
    layer.style.transform = `translateZ(${i - EDGE_LAYERS / 2 + 0.5}px)`;
    disc.append(layer);
  }
  ['front', 'back'].forEach((side) => {
    const face = document.createElement('div');
    face.className = `disc__face disc__face--${side}`;
    disc.append(face);
  });
}

function prefersReducedMotion() {
  if (new URLSearchParams(location.search).has('rm')) return true;
  return matchMedia('(prefers-reduced-motion: reduce)').matches;
}

function resetScene() {
  gsap.killTweensOf([disc, stage, flash, title]);
  disc.classList.remove('is-coin');
  gsap.set(stage, { backgroundColor: COLORS.felt });
  gsap.set(flash, { opacity: 0 });
  gsap.set(title, { opacity: 0, y: 12 });
  gsap.set(disc, { opacity: 1, x: 0, y: 220, rotationX: 72, rotationY: 0, scale: 0.7 });
}

function fullTimeline() {
  return gsap.timeline()
    .to(disc, { y: 0, rotationX: 0, scale: 1, duration: 0.7, ease: 'power3.out' })
    .to(disc, { rotationY: 450, duration: 1.3, ease: 'power2.in' })
    .add(() => disc.classList.add('is-coin'))
    .set(disc, { rotationY: -90 })
    .to(flash, { opacity: 0.55, duration: 0.06, yoyo: true, repeat: 1 }, '<')
    .to(stage, { backgroundColor: COLORS.oldGold, duration: 0.4 }, '<')
    .to(disc, { rotationY: 0, duration: 0.9, ease: 'power3.out' }, '<')
    .to(disc, { scale: 14, duration: 0.9, ease: 'power2.in' }, '+=0.25')
    .to(stage, { backgroundColor: COLORS.gold, duration: 0.3 }, '-=0.3')
    .set(disc, { opacity: 0 })
    .to(title, { opacity: 1, y: 0, duration: 0.6, ease: 'power2.out' });
}

function reducedTimeline() {
  gsap.set(disc, { y: 0, rotationX: 0, scale: 1 });
  return gsap.timeline()
    .to(disc, { opacity: 0, duration: 0.25, delay: 0.4 })
    .add(() => disc.classList.add('is-coin'))
    .to(disc, { opacity: 1, duration: 0.25 })
    .to(stage, { backgroundColor: COLORS.gold, duration: 0.4 }, '+=0.4')
    .to(disc, { opacity: 0, duration: 0.2 }, '<')
    .to(title, { opacity: 1, y: 0, duration: 0.3 });
}

function play() {
  resetScene();
  const reduced = prefersReducedMotion();
  document.getElementById('mode').textContent = reduced ? 'MODO: movimiento reducido' : 'MODO: completo';
  if (reduced) return reducedTimeline();
  return fullTimeline();
}

buildDisc();
document.getElementById('replay').addEventListener('click', play);
play();
</script>
</body>
</html>
