<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototipo 2 — Brasa a sol</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root { --bone: #F4EEE1; --ink: #0B0B0C; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #000; font-family: 'Courier Prime', monospace; color: var(--bone); display: grid; place-items: center; }
.stage { position: relative; width: min(100vw, 430px); height: min(100dvh, 932px); overflow: hidden; background: #0B1A33; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.cover { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
.title { position: absolute; left: 0; right: 0; top: 34%; text-align: center; color: var(--ink); opacity: 0; margin: 0; }
.title small { display: block; font-size: 12px; letter-spacing: .3em; margin-bottom: 8px; }
.title strong { font-family: 'Bodoni Moda', serif; font-weight: 500; font-size: 52px; }
.title em { display: block; font-family: 'Bodoni Moda', serif; font-size: 22px; }
.controls { position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
button { min-height: 44px; padding: 0 16px; background: var(--ink); color: var(--bone); border: 1px solid var(--bone); font-family: inherit; letter-spacing: .2em; cursor: pointer; }
</style>
</head>
<body>
<main class="stage" id="stage" aria-label="Transición: una brasa sube y se convierte en el sol del Caribe">
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="cover" id="cover"></div>
  <p class="title" id="title"><small>PARADA 5</small><strong>Jamaica</strong><em>Donde todo empezó</em></p>
  <div class="controls">
    <span id="mode"></span>
    <button type="button" id="replay">REPETIR</button>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
const PALETTE = {
  night: '#0B1A33',
  petrol: '#12566A',
  turquoise: '#1FB5B0',
  sea: '#128A86',
  sand: '#E8D3A2',
  fire: '#F2662A',
  amber: '#F2A64A',
  ink: '#0B0B0C',
};
const MAX_SPARKS = 90;

const stage = document.getElementById('stage');
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
const cover = document.getElementById('cover');
const title = document.getElementById('title');

let width = 0;
let height = 0;
let sparks = [];
let state = {};
let timeline = null;
let reduced = false;

function initialState() {
  return {
    sky: PALETTE.night,
    houseShift: 0,
    fire: 1,
    emberX: 0.5,
    emberY: 0.56,
    emberR: 3,
    emberColor: PALETTE.fire,
    glow: 8,
    seaTop: 1.1,
    sandTop: 1.2,
    islandShow: 0,
    palmX: -0.5,
  };
}

function finalState() {
  return {
    sky: PALETTE.turquoise,
    houseShift: 1.2,
    fire: 0,
    emberX: 0.5,
    emberY: 0.2,
    emberR: 52,
    emberColor: PALETTE.sand,
    glow: 30,
    seaTop: 0.58,
    sandTop: 0.82,
    islandShow: 1,
    palmX: 0,
  };
}

function resize() {
  const ratio = Math.min(window.devicePixelRatio || 1, 2);
  width = stage.clientWidth;
  height = stage.clientHeight;
  canvas.width = width * ratio;
  canvas.height = height * ratio;
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
}

function spawnSpark(houseTop) {
  if (sparks.length >= MAX_SPARKS) return;
  if (Math.random() > state.fire * 0.6) return;
  sparks.push({
    x: width * (0.35 + Math.random() * 0.3),
    y: houseTop + 10,
    vy: 0.6 + Math.random() * 1.2,
    phase: Math.random() * Math.PI * 2,
    life: 1,
    r: 1 + Math.random() * 1.6,
  });
}

function drawHouse(top, time) {
  const left = width * 0.24;
  const right = width * 0.76;
  const mid = width * 0.5;
  ctx.fillStyle = '#071022';
  ctx.beginPath();
  ctx.moveTo(0, top + 150);
  ctx.lineTo(width * 0.3, top + 120);
  ctx.lineTo(width, top + 140);
  ctx.lineTo(width, top + 600);
  ctx.lineTo(0, top + 600);
  ctx.fill();

  ctx.fillStyle = PALETTE.ink;
  ctx.beginPath();
  ctx.moveTo(left, top + 160);
  ctx.lineTo(left, top + 60);
  ctx.lineTo(mid, top);
  ctx.lineTo(right, top + 60);
  ctx.lineTo(right, top + 160);
  ctx.fill();

  if (state.fire <= 0.01) return;
  ctx.lineCap = 'round';
  [[-40, 14, PALETTE.fire], [0, 10, PALETTE.amber], [40, 12, PALETTE.fire], [-14, 6, PALETTE.amber]].forEach(([dx, w, color], i) => {
    const sway = Math.sin(time * 6 + i) * 8;
    ctx.strokeStyle = color;
    ctx.globalAlpha = state.fire;
    ctx.lineWidth = w;
    ctx.beginPath();
    ctx.moveTo(mid + dx, top + 50);
    ctx.bezierCurveTo(mid + dx - 20 + sway, top + 10, mid + dx + 20 - sway, top - 30, mid + dx + sway, top - 70 - i * 6);
    ctx.stroke();
  });
  ctx.globalAlpha = 1;
}

function drawSparks(houseTop) {
  spawnSpark(houseTop);
  sparks = sparks.filter((s) => s.life > 0);
  sparks.forEach((s) => {
    s.y -= s.vy;
    s.phase += 0.05;
    s.x += Math.sin(s.phase) * 0.4;
    s.life -= 0.006;
    ctx.globalAlpha = Math.max(s.life, 0) * Math.max(state.fire, 0.2);
    ctx.fillStyle = PALETTE.fire;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function drawEmber() {
  ctx.save();
  ctx.shadowColor = state.emberColor;
  ctx.shadowBlur = state.glow;
  ctx.fillStyle = state.emberColor;
  ctx.beginPath();
  ctx.arc(width * state.emberX, height * state.emberY, state.emberR, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawBeach() {
  const seaY = height * state.seaTop;
  ctx.fillStyle = PALETTE.sea;
  ctx.fillRect(0, seaY, width, height);

  if (state.islandShow > 0) {
    ctx.globalAlpha = state.islandShow;
    ctx.fillStyle = PALETTE.ink;
    ctx.beginPath();
    ctx.moveTo(width * 0.55, seaY);
    ctx.quadraticCurveTo(width * 0.66, seaY - 34, width * 0.78, seaY - 22);
    ctx.quadraticCurveTo(width * 0.86, seaY - 30, width * 0.94, seaY);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  const sandY = height * state.sandTop;
  ctx.fillStyle = PALETTE.sand;
  ctx.beginPath();
  ctx.moveTo(0, sandY);
  ctx.quadraticCurveTo(width * 0.45, sandY - 40, width, sandY + 20);
  ctx.lineTo(width, height);
  ctx.lineTo(0, height);
  ctx.fill();

  drawPalm(width * (0.12 + state.palmX), sandY);
}

function drawPalm(baseX, baseY) {
  const topX = baseX - 14;
  const topY = baseY - 260;
  ctx.strokeStyle = PALETTE.ink;
  ctx.lineWidth = 9;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(baseX, baseY + 10);
  ctx.quadraticCurveTo(baseX + 24, baseY - 140, topX, topY);
  ctx.stroke();
  ctx.fillStyle = PALETTE.ink;
  [[-90, 30], [100, 40], [20, -70], [-60, -40], [70, -30]].forEach(([dx, dy]) => {
    ctx.beginPath();
    ctx.moveTo(topX, topY);
    ctx.quadraticCurveTo(topX + dx * 0.5, topY + dy - 30, topX + dx, topY + dy);
    ctx.quadraticCurveTo(topX + dx * 0.5, topY + dy * 0.4, topX, topY + 4);
    ctx.fill();
  });
}

function render(time) {
  ctx.fillStyle = state.sky;
  ctx.fillRect(0, 0, width, height);
  const houseTop = height * (0.62 + state.houseShift);
  drawHouse(houseTop, reduced ? 0 : time);
  if (!reduced) drawSparks(houseTop);
  drawBeach();
  drawEmber();
}

function prefersReducedMotion() {
  if (new URLSearchParams(location.search).has('rm')) return true;
  return matchMedia('(prefers-reduced-motion: reduce)').matches;
}

function fullTimeline() {
  return gsap.timeline()
    .to(state, { emberY: 0.4, emberX: 0.47, houseShift: 0.5, duration: 1.4, ease: 'sine.inOut' }, 0.4)
    .to(state, { emberR: 22, glow: 26, houseShift: 1.2, fire: 0, emberX: 0.5, duration: 1.1, ease: 'sine.inOut' })
    .to(state, { sky: PALETTE.petrol, emberColor: PALETTE.amber, emberR: 34, duration: 0.8, ease: 'none' })
    .to(state, { sky: PALETTE.turquoise, emberColor: PALETTE.sand, emberR: 52, emberY: 0.2, glow: 30, seaTop: 0.58, duration: 1.1, ease: 'power2.out' })
    .to(state, { islandShow: 1, sandTop: 0.82, palmX: 0, duration: 0.9, ease: 'power3.out' }, '-=0.4')
    .to(title, { opacity: 1, y: 0, duration: 0.6, ease: 'power2.out' }, '-=0.2');
}

function reducedTimeline() {
  return gsap.timeline()
    .to(cover, { opacity: 1, duration: 0.35, delay: 0.8 })
    .add(() => Object.assign(state, finalState()))
    .to(cover, { opacity: 0, duration: 0.35 })
    .to(title, { opacity: 1, y: 0, duration: 0.3 });
}

function play() {
  if (timeline) timeline.kill();
  sparks = [];
  state = initialState();
  gsap.set(cover, { opacity: 0 });
  gsap.set(title, { opacity: 0, y: 12 });
  reduced = prefersReducedMotion();
  document.getElementById('mode').textContent = reduced ? 'MODO: movimiento reducido' : 'MODO: completo';
  timeline = reduced ? reducedTimeline() : fullTimeline();
}

resize();
window.addEventListener('resize', resize);
gsap.ticker.add((time) => render(time));
document.getElementById('replay').addEventListener('click', play);
play();
</script>
</body>
</html>
